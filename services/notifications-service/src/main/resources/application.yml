server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: notifications-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notificationsdb
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        observation-enabled: true         # continue the trace carried on each event
        default-requeue-rejected: false   # a failing message is dead-lettered, not requeued forever

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0                     # trace every message in this demo
