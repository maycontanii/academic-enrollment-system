# Scrapes the Spring Boot Actuator/Prometheus endpoints. DNS service discovery resolves each Compose
# service name to all of its replicas, so a scaled academic-service is fully covered.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: academic-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [academic-service]
        type: A
        port: 8081

  - job_name: notifications-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [notifications-service]
        type: A
        port: 8082
