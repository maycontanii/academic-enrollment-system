# Minimal reverse proxy / load balancer in front of academic-service. It exists so the API keeps a
# stable published port (8081) while the service itself has no host port and can be scaled:
# `docker compose up --scale academic-service=2`. Docker's embedded DNS (127.0.0.11) resolves the
# service name to every replica; using a variable in proxy_pass forces per-request re-resolution,
# so requests spread across replicas. (The seat race is actually contended on the RabbitMQ finalize
# queue, where every replica competes as a consumer — this proxy just keeps the HTTP entry stable.)
events {}

http {
    server {
        listen 8081;
        resolver 127.0.0.11 ipv6=off valid=10s;

        location / {
            set $backend http://academic-service:8081;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
